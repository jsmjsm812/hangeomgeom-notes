<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한능검 강의 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDEFFA;--surface:#fff;--fg:#1A1F3D;--muted:#586088;--line:#D3D8EE;--accent:#3446C9;--tile:#BFE1FF;--tile-fg:#0E2A57;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:40px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
main{max-width:720px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
h1{font:400 clamp(30px,7vw,44px)/1.25 "Black Han Sans","Noto Sans KR",sans-serif;margin:6px 0 8px}
p{margin:0;color:var(--muted)}
ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:12px}
a.day{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--fg)}
a.day:hover,a.day:focus-visible{border-color:var(--accent);outline:none}
.n{flex:none;width:56px;height:56px;border-radius:12px;background:var(--tile);color:var(--tile-fg);display:grid;place-items:center;font:400 22px/1 "Black Han Sans","Noto Sans KR",sans-serif}
.t{font-weight:700}.d{font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">서경석의 다이어트 한능검</div>
  <h1>한능검 강의 노트</h1>
  <p>강의를 일차별로 정리한 노트예요. 암기 타일과 별 표시로 중요한 부분을 모았어요.</p>
  <ul>
    <li><a class="day" href="day01/"><span class="n">강의</span><span><span class="t">강의 노트 (Day-01 ~ 04, 계속 추가)</span><br><span class="d">선사 ~ 고대 문화, 고려의 정치·경제·사회·문화. 다음 일차가 나오면 이어서 붙여요</span></span></a></li>
    <li><a class="day" href="summary/"><span class="n">요약</span><span><span class="t">압축 요약 노트</span><br><span class="d">선사부터 현대사까지 한 장으로, 중요한 부분엔 별 표시</span></span></a></li>
  </ul>
</main>
</body>
</html>
